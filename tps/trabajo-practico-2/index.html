<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React - Réplica de Navbar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="top-banner">
    <p>Únete a la React Conf del 7 al 8 de Octubre. <a href="https://react.dev" target="_blank" rel="noopener noreferrer">Más información.</a></p>
  </div>

  <header>
    <nav class="navbar">
      
      <div class="logo-container">
        <span class="logo-icon">⚛</span>
        <span class="logo-version">v19.1</span>
      </div>

      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Búsqueda" readonly>
      </div>

      <ul class="nav-links">
        <li><a href="#aprende">Aprende</a></li>
        <li><a href="#referencia">Referencia</a></li>
        <li><a href="https://react.dev/blog" target="_blank" rel="noopener noreferrer">Blog</a></li>
        <li><a href="https://github.com/facebook/react" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      </ul>

    </nav>
  </header>

  <main class="hero">
    <img src="Imagen - React.png" alt="React Hero Section" class="hero-img">
  </main>

</body>
</html>
